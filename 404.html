<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"><link rel="stylesheet" href="src/ClaireMurphyDemo.otf"><title>404 - Page Not Found</title><link rel="stylesheet" href="css/style.css"></head><body><main class="error-page"><div class="error-card"><div class="error-code">404</div><h1>Oops!</h1><p>The page you are looking for doesn't exist, was moved, or the link is incorrect. </p><div class="action-buttons"><a href="./" class="action-btn">Home </a><button onclick="history.back()" class="action-btn">Back </button></div></div></main></body><style>@font-face{ font-family: Claire Murphy DEMO; src: url(src/ClaireMurphyDemo.otf);} *{ font-family: Claire Murphy DEMO;} .error-page{ min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;} .error-card{ width: min(500px, 100%); padding: 40px; text-align: center; border-radius: 25px; background: var(--card-color); box-shadow: 8px 8px 20px var(--shadow-dark), -8px -8px 20px var(--shadow-light);} .error-code{ font-size: 7rem; font-weight: bold; color: var(--accent); line-height: 1;} .error-card h1{ margin: 10px 0;} .error-card p{ font-size: 1.1rem; line-height: 1.6; opacity: .8;} .action-buttons{ display: flex; justify-content: center; gap: 15px; margin-top: 25px;} .action-btn{ border: none; outline: none; text-decoration: none; color: var(--text-color); background: var(--card-color); padding: 12px 22px; border-radius: 15px; cursor: pointer; box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);} .action-btn:hover{ box-shadow: 5px 5px 12px var(--shadow-dark) inset, -5px -5px 12px var(--shadow-light) inset;}
</style></html>
